      dockerfile: Dockerfile.service
      args:
        PROJECT_PATH: ecommerce/services/CatalogService/Catalog.API.Read/Catalog.API.Read.csproj
        PROJECT_DLL: Catalog.API.Read.dll
    container_name: ecommerce-catalog-read-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      ASPNETCORE_Kestrel__Endpoints__Http__Url: http://+:8080
      ASPNETCORE_Kestrel__Endpoints__Http__Protocols: Http1
      ASPNETCORE_Kestrel__Endpoints__Grpc__Url: http://+:8081
      ASPNETCORE_Kestrel__Endpoints__Grpc__Protocols: Http2
      ConnectionStrings__CatalogWriteDb: server=mysql;port=3306;database=ecommerce-plataform-catalog-write;user=root;password=12345678
      ConnectionStrings__CatalogReadDb: server=mysql;port=3306;database=ecommerce-plataform-catalog-read;user=root;password=12345678
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    ports:
      - "5101:8080"

  catalog-write-api:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        PROJECT_PATH: ecommerce/services/CatalogService/Catalog.API.Write/Catalog.API.Write.csproj
