        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    ports:
      - "5111:8080"

  order-processor:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        PROJECT_PATH: ecommerce/services/OrderService/Order.API.Processor/Order.API.Processor.csproj
        PROJECT_DLL: Order.API.Processor.dll
    container_name: ecommerce-order-processor
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      ConnectionStrings__OrderWriteDb: server=mysql;port=3306;database=ecommerce-platform-order-write;user=root;password=12345678
      ConnectionStrings__OrderReadDb: server=mysql;port=3306;database=ecommerce-platform-order-read;user=root;password=12345678
      Kafka__BootstrapServers: kafka:9093
      CatalogService__BaseUrl: http://catalog-read-api:8081
      CustomerService__BaseUrl: http://customer-api:8081
      InventoryService__BaseUrl: http://inventory-api:8081
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  order-read-api:
