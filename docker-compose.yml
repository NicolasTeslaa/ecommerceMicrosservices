services:
  mysql:
    image: mysql:8.0.41
    container_name: ecommerce-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 12345678
    ports:
      - "3308:3306"
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - mysql_data:/var/lib/mysql

  kafka:
    image: apache/kafka:3.9.1
    container_name: ecommerce-kafka
    restart: unless-stopped
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "CONTROLLER://localhost:9091,DOCKER://:9093,HOST://:9094"
      KAFKA_ADVERTISED_LISTENERS: "DOCKER://kafka:9093,HOST://localhost:9094"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,DOCKER:PLAINTEXT,HOST:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "DOCKER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9091"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: "1"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9093 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 20s
    volumes:
      - kafka_data:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ecommerce-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: ecommerce-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9093
      KAFKA_CLUSTERS_0_READONLY: "false"

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.5
    container_name: ecommerce-aspire-dashboard
    restart: unless-stopped
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "18888:18888"
      - "4317:18889"

  bootstrap:
    build:
      context: .
      dockerfile: Dockerfile.bootstrap
    container_name: ecommerce-bootstrap
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_ROOT_PASSWORD: 12345678
      MYSQL_READY_TIMEOUT: "300"
      FORCE_CATALOG_SEED: "false"
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__AuthDb: server=mysql;port=3306;database=ecommerce-platform-auth;user=root;password=12345678
      ConnectionStrings__CartDb: server=mysql;port=3306;database=ecommerce-plataform-cart;user=root;password=12345678
      ConnectionStrings__CatalogWriteDb: server=mysql;port=3306;database=ecommerce-plataform-catalog-write;user=root;password=12345678
      ConnectionStrings__CatalogReadDb: server=mysql;port=3306;database=ecommerce-plataform-catalog-read;user=root;password=12345678
      ConnectionStrings__CustomerDb: server=mysql;port=3306;database=ecommerce-platform-customer;user=root;password=12345678
      ConnectionStrings__OrderWriteDb: server=mysql;port=3306;database=ecommerce-platform-order-write;user=root;password=12345678
      ConnectionStrings__OrderReadDb: server=mysql;port=3306;database=ecommerce-platform-order-read;user=root;password=12345678
      ConnectionStrings__PaymentDb: server=mysql;port=3306;database=ecommerce-platform-payment;user=root;password=12345678
      ConnectionStrings__InventoryDb: server=mysql;port=3306;database=ecommerce-platform-inventory;user=root;password=12345678
      ConnectionStrings__NotaFiscalDb: server=mysql;port=3306;database=ecommerce-platform-nota-fiscal;user=root;password=12345678
    depends_on:
      mysql:
        condition: service_healthy

  auth-api:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        PROJECT_PATH: ecommerce/services/AuthService/Auth.API/Auth.API.csproj
        PROJECT_DLL: Auth.API.dll
    container_name: ecommerce-auth-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      ConnectionStrings__AuthDb: server=mysql;port=3306;database=ecommerce-platform-auth;user=root;password=12345678
      Kafka__BootstrapServers: kafka:9093
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    ports:
      - "5106:8080"

  cart-api:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        PROJECT_PATH: ecommerce/services/CartService/Cart.API/Cart.API.csproj
        PROJECT_DLL: Cart.API.dll
    container_name: ecommerce-cart-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      ConnectionStrings__CartDb: server=mysql;port=3306;database=ecommerce-plataform-cart;user=root;password=12345678
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    ports:
      - "5102:8080"

  catalog-read-api:
