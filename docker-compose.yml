      ASPNETCORE_Kestrel__Endpoints__Grpc__Url: http://+:8081
      ASPNETCORE_Kestrel__Endpoints__Grpc__Protocols: Http2
      ConnectionStrings__OrderWriteDb: server=mysql;port=3306;database=ecommerce-platform-order-write;user=root;password=12345678
      ConnectionStrings__OrderReadDb: server=mysql;port=3306;database=ecommerce-platform-order-read;user=root;password=12345678
      Kafka__BootstrapServers: kafka:9093
      CustomerService__BaseUrl: http://customer-api:8080
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    ports:
      - "5103:8080"

  order-write-api:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        PROJECT_PATH: ecommerce/services/OrderService/Order.API.Write/Order.API.Write.csproj
        PROJECT_DLL: Order.API.Write.dll
    container_name: ecommerce-order-write-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      ConnectionStrings__OrderWriteDb: server=mysql;port=3306;database=ecommerce-platform-order-write;user=root;password=12345678
      ConnectionStrings__OrderReadDb: server=mysql;port=3306;database=ecommerce-platform-order-read;user=root;password=12345678
      Kafka__BootstrapServers: kafka:9093
      CatalogService__BaseUrl: http://catalog-read-api:8081
      CustomerService__BaseUrl: http://customer-api:8081
      InventoryService__BaseUrl: http://inventory-api:8081
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    ports:
      - "5108:8080"

  payment-api:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        PROJECT_PATH: ecommerce/services/PaymentService/Payment.API/Payment.API.csproj
        PROJECT_DLL: Payment.API.dll
    container_name: ecommerce-payment-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      ConnectionStrings__PaymentDb: server=mysql;port=3306;database=ecommerce-platform-payment;user=root;password=12345678
      Kafka__BootstrapServers: kafka:9093
      OrderService__ReadBaseUrl: http://order-read-api:8081
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    ports:
      - "5110:8080"

  nota-fiscal-api:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        PROJECT_PATH: ecommerce/services/NotaFiscalService/NotaFiscal.API/NotaFiscal.API.csproj
        PROJECT_DLL: NotaFiscal.API.dll
    container_name: ecommerce-nota-fiscal-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      ConnectionStrings__NotaFiscalDb: server=mysql;port=3306;database=ecommerce-platform-nota-fiscal;user=root;password=12345678
      Kafka__BootstrapServers: kafka:9093
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    ports:
      - "5112:8080"

  shipping-api:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        PROJECT_PATH: ecommerce/services/ShippingService/Shipping.API/Shipping.API.csproj
        PROJECT_DLL: Shipping.API.dll
    container_name: ecommerce-shipping-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    ports:
      - "5109:8080"

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        PROJECT_PATH: ecommerce/gateway/ApiGateway/ApiGateway.csproj
        PROJECT_DLL: ApiGateway.dll
    container_name: ecommerce-api-gateway
    restart: unless-stopped
    environment:
      DOTNET_ENVIRONMENT: Docker
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      ReverseProxy__Clusters__catalog-read-cluster__Destinations__destination1__Address: http://catalog-read-api:8080/
      ReverseProxy__Clusters__catalog-write-cluster__Destinations__destination1__Address: http://catalog-write-api:8080/
      ReverseProxy__Clusters__cart-cluster__Destinations__destination1__Address: http://cart-api:8080/
      ReverseProxy__Clusters__auth-cluster__Destinations__destination1__Address: http://auth-api:8080/
      ReverseProxy__Clusters__customer-cluster__Destinations__destination1__Address: http://customer-api:8080/
      ReverseProxy__Clusters__shipping-cluster__Destinations__destination1__Address: http://shipping-api:8080/
      ReverseProxy__Clusters__order-read-cluster__Destinations__destination1__Address: http://order-read-api:8080/
      ReverseProxy__Clusters__order-write-cluster__Destinations__destination1__Address: http://order-write-api:8080/
      ReverseProxy__Clusters__payment-cluster__Destinations__destination1__Address: http://payment-api:8080/
      ReverseProxy__Clusters__inventory-cluster__Destinations__destination1__Address: http://inventory-api:8080/
      ReverseProxy__Clusters__invoice-cluster__Destinations__destination1__Address: http://nota-fiscal-api:8080/
    depends_on:
      auth-api:
        condition: service_started
      cart-api:
        condition: service_started
      catalog-read-api:
        condition: service_started
      catalog-write-api:
        condition: service_started
      customer-api:
        condition: service_started
      inventory-api:
        condition: service_started
      order-read-api:
        condition: service_started
      order-write-api:
        condition: service_started
      payment-api:
        condition: service_started
      nota-fiscal-api:
        condition: service_started
      shipping-api:
        condition: service_started
    ports:
      - "5100:8080"

volumes:
  kafka_data:
  mysql_data:
