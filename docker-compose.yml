  inventory-api:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        PROJECT_PATH: ecommerce/services/InventoryService/Inventory.API/Inventory.API.csproj
        PROJECT_DLL: Inventory.API.dll
    container_name: ecommerce-inventory-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      ASPNETCORE_Kestrel__Endpoints__Http__Url: http://+:8080
      ASPNETCORE_Kestrel__Endpoints__Http__Protocols: Http1
      ASPNETCORE_Kestrel__Endpoints__Grpc__Url: http://+:8081
      ASPNETCORE_Kestrel__Endpoints__Grpc__Protocols: Http2
      ConnectionStrings__InventoryDb: server=mysql;port=3306;database=ecommerce-platform-inventory;user=root;password=12345678
      Kafka__BootstrapServers: kafka:9093
      CatalogService__BaseUrl: http://catalog-read-api:8080
    depends_on:
